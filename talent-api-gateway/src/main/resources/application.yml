server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: profile-service
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/profiles/**

            - id: job-service
              uri: lb://JOB-SERVICE
              predicates:
                - Path=/jobs/**

            - id: application-service
              uri: lb://APPLICATION-SERVICE
              predicates:
                - Path=/applications/**


jwt:
  secret: 12345678901234567890123456789012345678901234567890


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway